name: Build Android APK

# Builds the LostBoard / T.R.I.A.D. DAW into an installable Android APK.
# GitHub-hosted runners ship the full Android SDK and have network access to
# Google's servers, so the whole toolchain the web sandbox lacks lives here.
#
# Every run:
#   * uploads the signed APK as a workflow artifact (Actions tab -> run -> Artifacts)
#   * refreshes the rolling "apk-latest" pre-release so the APK has a stable,
#     phone-openable download link
#   * mirrors the APK onto the orphan "apk-build" branch for scripted retrieval

on:
  push:
    branches:
      - main
      - claude/grapheneos-pixel9-apk-tfe52s
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          cp "$SRC" LostBoard.apk
          ls -la LostBoard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LostBoard-apk
          path: LostBoard.apk
          if-no-files-found: error

      - name: Publish rolling pre-release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'claude/grapheneos-pixel9-apk-tfe52s'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest LostBoard.apk \
            --title "LostBoard APK (latest build)" \
            --notes "Automatically built from \`${GITHUB_SHA}\`. Download **LostBoard.apk** below and sideload it. See docs/ANDROID.md for install steps on GrapheneOS." \
            --prerelease \
            --target "${GITHUB_SHA}"

      - name: Mirror APK to apk-build branch
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'claude/grapheneos-pixel9-apk-tfe52s'
        run: |
          set -e
          cp LostBoard.apk /tmp/LostBoard.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/LostBoard.apk LostBoard.apk
          printf 'Auto-generated build branch. Holds the latest LostBoard.apk built by CI.\nDo not commit here by hand.\n' > README.md
          git add LostBoard.apk README.md
          git commit -m "Build APK from ${GITHUB_SHA}"
          git push -f origin apk-build
